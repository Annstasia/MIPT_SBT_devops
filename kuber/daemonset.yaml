apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-agent
spec:
  selector:
    matchLabels:
      name: log-agent
  template:
    metadata:
      labels:
        name: log-agent
    spec:
      containers:
        - name: log-agent
          image: busybox
          command: ["/bin/sh", "-c"]
          args:
            - tail -F /mnt/logs/*.log
          volumeMounts:
            - name: host-logs
              mountPath: /mnt/logs
      volumes:
        - name: host-logs
          hostPath:
            path: /app/logs
            type: DirectoryOrCreate